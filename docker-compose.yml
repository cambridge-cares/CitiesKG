version: "3"
services:
  frontend:
    image: nodejs:1.0.0
    container_name: frontend
    pull_policy: if_not_present
    build:
      context: "./3dcitydb-web-map-1.9.0"
    ports:
      - 8000:8000
    environment:
      LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
    volumes:
      - ./3dcitydb-web-map-1.9.0/3dwebclient:/usr/src/app/3dwebclient
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ckg_agents:
    image: ckg-agent:1.0.0
    container_name: ckg_agents
    pull_policy: if_not_present
    build:
      context: "./"
      dockerfile: "./dockerfile_war"
    ports:
      - 8080:8080
    environment:
      LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  # access-agent
  access-agent:
    image: ghcr.io/cambridge-cares/access-agent:1.7.0
    container_name: access-agent
    pull_policy: if_not_present
    environment:
      LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
      STOREROUTER_ENDPOINT: "http://blazegraph-access-agent:8080/blazegraph/namespace/kb/sparql"
      RDB_STOREROUTER_ENDPOINT: "http://www.theworldavatar.com/blazegraph/namespace/ontordbrouter/sparql"
      pull_policy: if_not_present
    ports:
      - 48888:8080
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Blazegraph
  blazegraph:
    image: ghcr.io/cambridge-cares/blazegraph:1.1.0
    container_name: "blazegraph-access-agent"
    environment:
      LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
    pull_policy: if_not_present
    restart: unless-stopped
    volumes:
      - blazegraph_data:/data
    ports:
      - 48889:8080
    networks:
      - default
    
# Volumes
volumes:
  blazegraph_data:

# Networks
networks:
  default:
    name: access_agent
