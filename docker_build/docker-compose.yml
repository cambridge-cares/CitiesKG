version: "1.0.0"

services:

  backend_cia:
    image: ckg-agent:1.0.0
    container_name: ckg_agents
    pull_policy: if_not_present
    build:
      context: "../"
      dockerfile: "../dockerfile_build"
    ports:
      - 8080:8080
    environment:
      LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"

# Volumes
volumes:
  blazegraph_data:

# Networks
networks:
  default:
    name: access_agent